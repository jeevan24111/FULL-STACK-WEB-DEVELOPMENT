<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>
</head>
<body>
    <h2>OUR EDUCATION</h2>
    <table border="3">
        <caption>MY EDUCATION</caption>
        <thead>
            <tr>
                <th>Degree</th>
                <th>College</th>
                <th>percentage</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>10Th Class</td>
                <td>FATHIMA SCHOOL</td>
                <td>98.96%</td>
            </tr>
            <tr>
                <td>12Th Class</td>
                <td>M Krishna Pu COLLEGE</td>
                <td>91%</td>
            </tr>
            <tr>
                <td>B.E</td>
                <td colspan="2">Govt. Engg. college</td>
                <td></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>total</td>
                <td colspan="2">3</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
