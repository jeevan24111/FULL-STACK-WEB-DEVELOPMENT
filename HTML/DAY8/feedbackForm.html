<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style=" background-color: rgb(179, 229, 118);">
    <h1>FEEDBACK FORM</h1><br>
    <fieldset style="display: flex; text-align: center; justify-content: center;align-items: center; flex-direction: column;">
    <label for="uname">YOUR NAME:</label>
    <input type="text" name="uname" placeholder="enter your name"><br>
    <label for="email">YOUR EMAIL:</label>
    <input type="email" name="email" placeholder="enter your name"><br>
    <label for="rate">RATE US</label>
    <div style="display: flex; font-size: 20px;">
    <label for="rate1">1 star</label>
    <input type="radio" name="rate" value="1" id="rate1">
    <label for="rate2">2 star</label>
    <input type="radio" name="rate" value="2" id="rate2">
    <label for="rate3">3 star</label>
    <input type="radio" name="rate" value="3" id="rate3">
    <label for="rate4">4 star</label>
    <input type="radio" name="rate" value="4" id="rate4">
    <label for="rate5">5 star</label>
    <input type="radio" name="rate" value="5" id="rate5">
    </div>
    <label for="comment">comment</label>
    <textarea name="comment" id="comment" rows="10" cols="100"></textarea>

    <button type="submit" style="font-size: 20px; background-color: aquamarine; border: none; border-radius: 10px;" >submit</button>
    </fieldset>
</body>
</html>
